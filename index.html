<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinic Management — Starter</title>
<style>
:root{--ink:#172b3a;--muted:#667785;--line:#dce6e9;--bg:#f4f8f8;--teal:#087e83;--deep:#075c61;--soft:#e6f4f2;--white:#fff;--red:#b33a48;--gold:#a76b00;--shadow:0 7px 24px #163c4d12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.sidebar{background:#103b47;color:#fff;padding:22px 15px;display:flex;flex-direction:column;gap:9px}.brand{font-size:19px;font-weight:750;padding:4px 10px 22px}.brand small{display:block;font-weight:400;color:#b9d6d8;font-size:12px;margin-top:3px}.nav{border:0;text-align:left;color:#d6e7e8;background:transparent;padding:11px 13px;border-radius:9px}.nav:hover,.nav.active{background:#ffffff1a;color:white}.sidefoot{margin-top:auto;font-size:12px;color:#b9d6d8;padding:10px}.main{min-width:0}.top{height:72px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 27px;gap:12px}.top h1{font-size:20px;margin:0}.top-right{display:flex;align-items:center;gap:10px}.role{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}.page{padding:25px;max-width:1500px;margin:auto}.notice{background:#fff8e6;border:1px solid #f0d48d;border-radius:10px;padding:13px 15px;margin-bottom:18px;color:#634e20;font-size:13px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow)}.stat-label{font-size:13px;color:var(--muted)}.stat{font-size:28px;font-weight:750;margin-top:7px}.stat-sub{font-size:12px;color:var(--muted);margin-top:3px}.cols{grid-template-columns:1.35fr 1fr}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px}.section-head h2{font-size:17px;margin:0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px}.btn:hover{background:#f3f8f8}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{color:var(--red)}.btn.sm{font-size:12px;padding:5px 8px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{max-width:240px}input,select,textarea{border:1px solid #cbd8dc;border-radius:8px;padding:9px 10px;background:white;color:var(--ink);width:100%}textarea{min-height:76px;resize:vertical}label{font-size:12px;color:#536773;display:grid;gap:5px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #e8eef0;white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.tag{display:inline-block;border-radius:999px;padding:3px 8px;background:var(--soft);color:var(--deep);font-size:11px}.tag.warn{background:#fff1d8;color:#885900}.tag.red{background:#ffeaec;color:#9b2634}.empty{color:var(--muted);padding:20px;text-align:center}.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:6px;overflow:auto}.day{min-height:112px;background:white;border:1px solid var(--line);border-radius:9px;padding:8px}.dayhead{font-size:11px;color:var(--muted);margin-bottom:8px}.event{background:var(--soft);border-left:3px solid var(--teal);padding:5px 6px;margin:4px 0;border-radius:4px;font-size:11px;white-space:normal}.event button{border:0;background:none;color:var(--deep);padding:0;font-size:11px}.dental{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:690px}.tooth{padding:9px 4px;border:1px solid #bdccd0;border-radius:7px;background:#fff;text-align:center;font-size:12px}.tooth.selected{background:#d9f2ed;border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}.tooth.hasnote{background:#fff0d6}.modal{position:fixed;inset:0;background:#102b35a8;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.dialog{background:white;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:21px;box-shadow:0 20px 70px #001a2b44}.dialog h2{margin:0 0 17px;font-size:19px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.message{padding:10px 12px;border-radius:8px;background:#f1f7f7;margin:8px 0;font-size:13px}.muted{color:var(--muted)}.hide{display:none!important}.inline{display:flex;gap:8px;align-items:center}.inline>*{width:auto}.small{font-size:12px}.warnbox{background:#fff2e9;border:1px solid #f0c8a9;padding:11px;border-radius:8px;font-size:12px;color:#714524}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:2;flex-direction:row;overflow:auto;padding:8px}.brand{display:none}.nav{white-space:nowrap;padding:9px}.sidefoot{display:none}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.page{padding:15px}.top{padding:0 15px}.split{grid-template-columns:1fr}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.stat{font-size:23px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.top h1{font-size:17px}.role{max-width:145px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand">ClinicDesk <small>Practice management starter</small></div>
<button class="nav active" data-page="dashboard">▦ &nbsp; Dashboard</button><button class="nav" data-page="calendar">▣ &nbsp; Calendar</button><button class="nav" data-page="patients">♡ &nbsp; Patients</button><button class="nav" data-page="doctors">✚ &nbsp; Doctors & payroll</button><button class="nav" data-page="services">◇ &nbsp; Services & packages</button><button class="nav" data-page="finance">▤ &nbsp; Finance & books</button><button class="nav" data-page="inventory">▧ &nbsp; Inventory</button><button class="nav" data-page="dental">⚕ &nbsp; Dental chart</button><button class="nav" data-page="logs">☷ &nbsp; Logs</button><button class="nav" data-page="settings">⚙ &nbsp; Settings / Appwrite</button><div class="sidefoot">Offline-first sample • Do not enter real patient data</div></aside>
<main class="main"><header class="top"><h1 id="pageTitle">Dashboard</h1><div class="top-right"><span class="small muted">Access view</span><select class="role" id="role"><option value="owner">Owner / Management</option><option value="doctor">Doctor</option></select></div></header><div class="page" id="page"></div></main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="dialog-actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveModal">Save</button></div></div></div>
<script>
/* ClinicDesk is a demonstration starter. Browser storage and UI roles are not secure for production. */
const KEY='clinicdesk-starter-v1';
const seed={patients:[],doctors:[],appointments:[],services:[],inventory:[],transactions:[],logs:[],settings:{currency:'EGP',whatsappTemplate:'Hello {name}, this is a reminder for your {service} session on {date} at {time}. Please contact the clinic if you need to reschedule.'}};
let db=load(), current='dashboard', selectedTooth=null;
function load(){try{return {...structuredClone(seed),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function log(action,detail){db.logs.unshift({date:new Date().toLocaleString(),action,detail});db.logs=db.logs.slice(0,300);save()}
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>`${esc(db.settings.currency||'EGP')} ${Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
function today(){return new Date().toISOString().slice(0,10)}
function uuid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function patientsAllowed(){if($('#role').value==='owner')return db.patients;let ids=new Set(db.appointments.filter(a=>a.doctorId===activeDoctorId()).map(a=>a.patientId));return db.patients.filter(p=>ids.has(p.id))}
function activeDoctorId(){return localStorage.getItem('clinicdesk-doctor-id')||db.doctors[0]?.id||''}
function patientName(id){return db.patients.find(x=>x.id===id)?.name||'Unknown patient'}function doctorName(id){return db.doctors.find(x=>x.id===id)?.name||'Unassigned'}function serviceName(id){return db.services.find(x=>x.id===id)?.name||'Session'}
function pageTitle(){return current[0].toUpperCase()+current.slice(1)}
function setPage(p){current=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#pageTitle').textContent=p==='finance'?'Finance & books':p==='dental'?'Dental chart':p==='settings'?'Settings / Appwrite':pageTitle();render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#role').onchange=()=>{if($('#role').value==='doctor'&&db.doctors.length&&!localStorage.getItem('clinicdesk-doctor-id'))localStorage.setItem('clinicdesk-doctor-id',db.doctors[0].id);render()};
function cardStat(label,value,sub){return `<div class="card"><div class="stat-label">${label}</div><div class="stat">${value}</div><div class="stat-sub">${sub||''}</div></div>`}
function render(){let root=$('#page');if(current==='dashboard')root=dashboard(root);if(current==='calendar')root=calendar(root);if(current==='patients')root=patients(root);if(current==='doctors')root=doctors(root);if(current==='services')root=services(root);if(current==='finance')root=finance(root);if(current==='inventory')root=inventory(root);if(current==='dental')root=dental(root);if(current==='logs')root=logs(root);if(current==='settings')root=settings(root);}
function dashboard(root){let future=db.appointments.filter(a=>a.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let month=new Date().toISOString().slice(0,7),tx=db.transactions.filter(t=>t.date?.startsWith(month)),income=tx.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0),expense=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);root.innerHTML=`<div class="notice"><b>Sample app notice:</b> This is a front-end starter, not a compliant clinical system. Use fictional data only until authentication, server-side permissions, backups, and legal/security review are implemented.</div><div class="grid stats">${cardStat('Patients',db.patients.length,'Profiles in this browser')}${cardStat('Upcoming sessions',future.length,'Scheduled from today')}${cardStat('Income this month',money(income),'Recorded transactions')}${cardStat('Net this month',money(income-expense),'Income minus expenses')}</div><div class="grid cols"><div class="card"><div class="section-head"><h2>Upcoming sessions</h2><button class="btn sm" onclick="setPage('calendar')">Open calendar</button></div>${future.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Service</th><th>Doctor</th><th></th></tr></thead><tbody>${future.slice(0,7).map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td>${esc(patientName(a.patientId))}</td><td>${esc(serviceName(a.serviceId))}</td><td>${esc(doctorName(a.doctorId))}</td><td><button class="btn sm" onclick="sendWhatsApp('${a.id}')">WhatsApp</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No upcoming sessions. Add one in the calendar.</div>`}</div><div class="card"><div class="section-head"><h2>Quick actions</h2></div><div class="inline" style="flex-wrap:wrap"><button class="btn primary" onclick="openPatient()">Add patient</button><button class="btn" onclick="openAppointment()">Schedule session</button><button class="btn" onclick="setPage('finance')">Record payment</button></div><div class="message">Patient journey: profile → appointment → session/package usage → payment → follow-up reminder. Track each stage in the patient record and appointment notes.</div></div></div>`;return root}
function calendar(root){let start=new Date();start.setDate(1);let first=start.getDay(),days=new Date(start.getFullYear(),start.getMonth()+1,0).getDate();let cells=Array.from({length:first},()=>'<div></div>');for(let d=1;d<=days;d++){let date=`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ap=db.appointments.filter(a=>a.date===date);cells.push(`<div class="day"><div class="dayhead">${d}</div>${ap.map(a=>`<div class="event">${esc(a.time)} · ${esc(patientName(a.patientId))}<br><span>${esc(serviceName(a.serviceId))}</span></div>`).join('')}</div>`)}root.innerHTML=`<div class="card"><div class="section-head"><h2>${start.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><button class="btn primary" onclick="openAppointment()">+ Add session</button></div><div class="calendar-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${cells.join('')}</div></div><div class="card" style="margin-top:15px"><div class="section-head"><h2>Session list</h2></div>${tableAppointments(db.appointments)}</div>`;return root}
function tableAppointments(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Service</th><th>Doctor</th><th>Status</th><th>Actions</th></tr></thead><tbody>${[...list].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td>${esc(patientName(a.patientId))}</td><td>${esc(serviceName(a.serviceId))}</td><td>${esc(doctorName(a.doctorId))}</td><td><span class="tag">${esc(a.status||'Booked')}</span></td><td><button class="btn sm" onclick="sendWhatsApp('${a.id}')">WhatsApp</button> <button class="btn sm danger" onclick="deleteItem('appointments','${a.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No sessions recorded.</div>`}
function patients(root){let list=patientsAllowed();root.innerHTML=`<div class="card"><div class="section-head"><h2>Patient profiles</h2>${$('#role').value==='owner'?'<button class="btn primary" onclick="openPatient()">+ Add patient</button>':''}</div><div class="toolbar"><input id="patientSearch" placeholder="Search name or phone" oninput="filterPatients()"><span class="small muted">Doctor access view shows patients assigned through scheduled sessions only.</span></div><div id="patientTable">${patientRows(list)}</div></div>`;return root}
function patientRows(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Medical history</th><th>Journey / notes</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${esc(p.history||'—')}</td><td>${esc(p.journey||'New')}</td><td><button class="btn sm" onclick="viewPatient('${p.id}')">Open</button> ${$('#role').value==='owner'?`<button class="btn sm" onclick="openPatient('${p.id}')">Edit</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No patient profiles yet.</div>`}
window.filterPatients=()=>{let q=$('#patientSearch').value.toLowerCase();$('#patientTable').innerHTML=patientRows(patientsAllowed().filter(p=>(p.name+' '+p.phone).toLowerCase().includes(q)))};
function doctors(root){if($('#role').value!=='owner'){root.innerHTML='<div class="notice">Doctor management and payroll are available to management in this starter view.</div>';return root}root.innerHTML=`<div class="card"><div class="section-head"><h2>Doctors & compensation</h2><button class="btn primary" onclick="openDoctor()">+ Add doctor</button></div><div class="message">Compensation is estimated from each completed appointment's doctor-specific rate, plus any laser pulse rate recorded on the session. Confirm payroll rules with your accountant.</div>${db.doctors.length?`<div class="table-wrap"><table><thead><tr><th>Doctor</th><th>Phone / email</th><th>Specialty</th><th>Base salary</th><th>Per-session</th><th>Pulse rate</th><th>Earned this month*</th><th>Actions</th></tr></thead><tbody>${db.doctors.map(d=>{let earned=db.appointments.filter(a=>a.doctorId===d.id&&a.date?.startsWith(new Date().toISOString().slice(0,7))&&a.status==='Completed').reduce((s,a)=>s+Number(a.sessionPay||d.sessionPay||0)+Number(a.pulses||0)*Number(a.pulsePay||d.pulsePay||0),0);return `<tr><td>${esc(d.name)}</td><td>${esc(d.contact||'')}</td><td>${esc(d.specialty||'')}</td><td>${money(d.salary)}</td><td>${money(d.sessionPay)}</td><td>${money(d.pulsePay)}/pulse</td><td>${money(earned)}</td><td><button class="btn sm" onclick="openDoctor('${d.id}')">Edit</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">No doctors added.</div>`}<div class="small muted">*Calculated from completed sessions for the current month; this is not a payroll statement.</div></div>`;return root}
function services(root){root.innerHTML=`<div class="card"><div class="section-head"><h2>Services, costs & laser packages</h2>${$('#role').value==='owner'?'<button class="btn primary" onclick="openService()">+ Add service / package</button>':''}</div>${db.services.length?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Type</th><th>Cost</th><th>Price</th><th>Package pulses</th><th>Notes</th><th></th></tr></thead><tbody>${db.services.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.type||'Service')}</td><td>${money(s.cost)}</td><td>${money(s.price)}</td><td>${s.pulses?esc(s.pulses):'—'}</td><td>${esc(s.notes||'')}</td><td>${$('#role').value==='owner'?`<button class="btn sm" onclick="openService('${s.id}')">Edit</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No services or packages yet.</div>`}</div><div class="card" style="margin-top:15px"><b>Laser usage tracking</b><p class="small muted">A session can record pulses used and package pulses remaining. Record the package on the patient/session and verify counts before treatment; this starter does not enforce clinical validation.</p></div>`;return root}
function finance(root){if($('#role').value!=='owner'){root.innerHTML='<div class="notice">Financial books and reporting are restricted to management in this starter view.</div>';return root}let sum=t=>db.transactions.filter(x=>x.type===t).reduce((n,x)=>n+Number(x.amount||0),0);root.innerHTML=`<div class="grid stats">${cardStat('Income',money(sum('income')),'All recorded transactions')}${cardStat('Expenses',money(sum('expense')),'All recorded transactions')}${cardStat('Net',money(sum('income')-sum('expense')),'Income less expenses')}${cardStat('Payment methods',new Set(db.transactions.map(t=>t.method).filter(Boolean)).size,'Methods in use')}</div><div class="card"><div class="section-head"><h2>Financial book</h2><button class="btn primary" onclick="openTransaction()">+ Record entry</button></div>${db.transactions.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Patient</th><th>Details</th><th>Method</th><th>Amount</th><th></th></tr></thead><tbody>${db.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${esc(t.date)}</td><td><span class="tag ${t.type==='expense'?'warn':''}">${esc(t.type)}</span></td><td>${esc(patientName(t.patientId))}</td><td>${esc(t.details)}</td><td>${esc(t.method)}</td><td>${money(t.amount)}</td><td><button class="btn sm danger" onclick="deleteItem('transactions','${t.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No financial entries yet.</div>`}</div><div class="warnbox" style="margin-top:14px">This is a basic cashbook, not an accounting system. Reconcile entries and protect financial records with a properly secured backend.</div>`;return root}
function inventory(root){root.innerHTML=`<div class="card"><div class="section-head"><h2>Inventory</h2>${$('#role').value==='owner'?'<button class="btn primary" onclick="openInventory()">+ Add item</button>':''}</div>${db.inventory.length?`<div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th>Qty on hand</th><th>Reorder at</th><th>Unit cost</th><th>Status</th><th></th></tr></thead><tbody>${db.inventory.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.category)}</td><td>${esc(i.qty)}</td><td>${esc(i.reorder)}</td><td>${money(i.cost)}</td><td><span class="tag ${Number(i.qty)<=Number(i.reorder)?'red':''}">${Number(i.qty)<=Number(i.reorder)?'Reorder':'In stock'}</span></td><td>${$('#role').value==='owner'?`<button class="btn sm" onclick="adjustStock('${i.id}')">Adjust</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No inventory items recorded.</div>`}</div>`;return root}
function dental(root){let upper=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],lower=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];let pList=patientsAllowed();root.innerHTML=`<div class="card"><div class="section-head"><h2>Dental chart</h2><span class="small muted">Choose a patient, then select a tooth to record a note.</span></div><div class="toolbar"><select id="dentalPatient"><option value="">Select patient</option>${pList.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn" onclick="loadDentalNotes()">Load notes</button></div><div class="small muted">Upper arch</div><div class="dental">${upper.map(n=>toothButton(n)).join('')}</div><div style="height:14px"></div><div class="dental">${lower.map(n=>toothButton(n)).join('')}</div><div class="small muted" style="margin-top:8px">Lower arch · Click a tooth to add or edit its note. Notes are demonstration records only.</div><div id="toothNote" style="margin-top:17px"></div></div><div class="warnbox" style="margin-top:14px">This simple chart is not a diagnostic device or a substitute for a validated dental record. Use a clinically reviewed charting system for care.</div>`;return root}
function toothButton(n){return `<button class="tooth" id="tooth-${n}" onclick="selectTooth(${n})">${n}</button>`}
window.loadDentalNotes=()=>{let pid=$('#dentalPatient').value;document.querySelectorAll('.tooth').forEach(b=>{let note=db.dental?.[pid]?.[b.textContent];b.classList.toggle('hasnote',!!note)});$('#toothNote').innerHTML=''};
window.selectTooth=n=>{selectedTooth=n;document.querySelectorAll('.tooth').forEach(b=>b.classList.toggle('selected',Number(b.textContent)===n));let pid=$('#dentalPatient').value;if(!pid){$('#toothNote').innerHTML='<div class="message">Select a patient first.</div>';return}let val=db.dental?.[pid]?.[n]||'';$('#toothNote').innerHTML=`<label>Tooth ${n} clinical note<textarea id="toothText" placeholder="Enter an observation or planned treatment">${esc(val)}</textarea></label><button class="btn primary" style="margin-top:8px" onclick="saveTooth()">Save tooth note</button>`};
window.saveTooth=()=>{let pid=$('#dentalPatient').value;if(!pid||!selectedTooth)return;db.dental=db.dental||{};db.dental[pid]=db.dental[pid]||{};db.dental[pid][selectedTooth]=$('#toothText').value;save();log('Dental note saved',`Tooth ${selectedTooth}`);loadDentalNotes();selectTooth(selectedTooth)};
function logs(root){root.innerHTML=`<div class="card"><div class="section-head"><h2>Activity log</h2><span class="small muted">Recent actions in this browser</span></div>${db.logs.length?`<div class="table-wrap"><table><thead><tr><th>Time</th><th>Action</th><th>Details</th></tr></thead><tbody>${db.logs.map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(l.action)}</td><td>${esc(l.detail)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No actions recorded yet.</div>`}</div>`;return root}
function settings(root){root.innerHTML=`<div class="card"><div class="section-head"><h2>Offline storage & export</h2></div><p class="small">This starter saves data in this browser using local storage. It remains available offline on this device, but can be lost if browser data is cleared. It does not synchronize devices.</p><div class="toolbar"><button class="btn" onclick="exportData()">Export JSON backup</button><label class="btn">Import JSON<input id="importFile" type="file" accept="application/json" class="hide" onchange="importData(event)"></label><button class="btn danger" onclick="clearData()">Clear local data</button></div></div><div class="card" style="margin-top:15px"><div class="section-head"><h2>Appwrite connection settings</h2></div><div class="warnbox">A browser-only Appwrite integration must never contain an API key or rely on hidden UI controls for access control. Configure Appwrite Auth, database permissions, and server-side validation before using real records. The scaffold below stores only a client endpoint/project ID in this browser.</div><div class="form-grid" style="margin-top:14px"><label>Appwrite endpoint<input id="endpoint" placeholder="https://cloud.appwrite.io/v1"></label><label>Project ID<input id="projectId" placeholder="Your project ID"></label><label>Database ID<input id="databaseId" placeholder="Database ID"></label><label>Collection ID<input id="collectionId" placeholder="Collection ID"></label></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" onclick="saveAppwrite()">Save settings</button><button class="btn" onclick="testAppwrite()">Check SDK connection</button></div><div id="appwriteStatus" class="small muted"></div><p class="small muted">Appwrite's browser SDK is loaded from a CDN below. Replace the demo persistence layer with authenticated, permission-checked document operations for your schema. A production setup also needs migrations, encryption/backup strategy, audit trails, consent handling, and professional privacy/security review.</p></div><div class="card" style="margin-top:15px"><div class="section-head"><h2>WhatsApp reminders</h2></div><p class="small">The session button opens a prefilled WhatsApp message. Automatic sending or a two-way bot requires WhatsApp Business Platform and a secure server-side webhook; it cannot be done safely with HTML/CSS/JS in a static browser app alone.</p><label>Reminder text<textarea id="waTemplate">${esc(db.settings.whatsappTemplate)}</textarea></label><button class="btn" style="margin-top:8px" onclick="saveTemplate()">Save reminder template</button></div><div class="card" style="margin-top:15px"><div class="section-head"><h2>Role view demo</h2></div><p class="small">Switch the top access view to demonstrate limited doctor screens. The currently selected doctor is set in local storage; add authenticated identities and server-enforced patient assignment permissions before deployment.</p><label>Doctor shown in demo<select id="activeDoctor">${db.doctors.map(d=>`<option value="${d.id}" ${activeDoctorId()===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><button class="btn" style="margin-top:8px" onclick="setActiveDoctor()">Set doctor</button></div>`;return root}
function openModal(title,html,onSave){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show');$('#saveModal').onclick=()=>{if(onSave()!==false){$('#modal').classList.remove('show');render()}}}
$('#cancelModal').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
function field(name,label,val='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(val)}" ${extra}></label>`}function area(name,label,val=''){return `<label class="full">${label}<textarea name="${name}">${esc(val)}</textarea></label>`}function formValues(){let o={};$('#modalBody').querySelectorAll('[name]').forEach(x=>o[x.name]=x.value);return o}
window.openPatient=id=>{if($('#role').value!=='owner')return;let p=db.patients.find(x=>x.id===id)||{};openModal(id?'Edit patient':'Add patient',`<div class="form-grid">${field('name','Full name',p.name||'')}${field('phone','Phone / WhatsApp',p.phone||'','tel')}${field('email','Email',p.email||'','email')}${field('dob','Date of birth',p.dob||'','date')}${area('history','Medical history / allergies / relevant notes',p.history||'')}${area('journey','Patient journey / follow-up notes',p.journey||'New')}</div>`,()=>{let v=formValues();if(!v.name.trim())return alert('Patient name is required.'),false;if(id)Object.assign(p,v);else db.patients.push({id:uuid(),...v});save();log(id?'Patient updated':'Patient added',v.name)})};
window.viewPatient=id=>{let p=db.patients.find(x=>x.id===id);if(!p)return;let tx=db.transactions.filter(t=>t.patientId===id);let ap=db.appointments.filter(a=>a.patientId===id);openModal('Patient profile',`<div class="message"><b>${esc(p.name)}</b><br>Phone: ${esc(p.phone||'—')} · DOB: ${esc(p.dob||'—')}<br><br><b>Medical history</b><br>${esc(p.history||'No history recorded')}<br><br><b>Journey / follow-up</b><br>${esc(p.journey||'—')}</div><h3>Sessions</h3>${tableAppointments(ap)}<h3>Financial statement</h3>${tx.length?`<div class="table-wrap"><table><tr><th>Date</th><th>Details</th><th>Method</th><th>Amount</th></tr>${tx.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.details)}</td><td>${esc(t.method)}</td><td>${money(t.amount)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No entries recorded.</div>'}`,()=>true);$('#saveModal').classList.add('hide');$('#cancelModal').onclick=()=>{$('#modal').classList.remove('show');$('#saveModal').classList.remove('hide');$('#cancelModal').onclick=()=>$('#modal').classList.remove('show')}};
window.openDoctor=id=>{let d=db.doctors.find(x=>x.id===id)||{};openModal(id?'Edit doctor':'Add doctor',`<div class="form-grid">${field('name','Full name',d.name||'')}${field('contact','Phone / email',d.contact||'')}${field('specialty','Specialty',d.specialty||'')}${field('salary','Base salary',d.salary||0,'number','min="0" step="0.01"')}${field('sessionPay','Pay per completed session',d.sessionPay||0,'number','min="0" step="0.01"')}${field('pulsePay','Pay per laser pulse',d.pulsePay||0,'number','min="0" step="0.0001"')}</div>`,()=>{let v=formValues();if(!v.name.trim())return alert('Doctor name is required.'),false;if(id)Object.assign(d,v);else db.doctors.push({id:uuid(),...v});save();log(id?'Doctor updated':'Doctor added',v.name)})};
window.openService=id=>{let s=db.services.find(x=>x.id===id)||{};openModal(id?'Edit service':'Add service / package',`<div class="form-grid">${field('name','Service or package name',s.name||'') }<label>Type<select name="type"><option ${s.type==='Laser package'?'selected':''}>Laser package</option><option ${s.type==='Service'?'selected':''}>Service</option><option ${s.type==='Dental'?'selected':''}>Dental</option></select></label>${field('cost','Clinic cost',s.cost||0,'number','min="0" step="0.01"')}${field('price','Patient price',s.price||0,'number','min="0" step="0.01"')}${field('pulses','Included laser pulses (if package)',s.pulses||0,'number','min="0" step="1"')}${area('notes','Details',s.notes||'')}</div>`,()=>{let v=formValues();if(!v.name.trim())return alert('Name is required.'),false;if(id)Object.assign(s,v);else db.services.push({id:uuid(),...v});save();log(id?'Service updated':'Service added',v.name)})};
window.openAppointment=()=>{let pats=patientsAllowed(),ds=db.doctors,sv=db.services;openModal('Schedule session',`<div class="form-grid"><label>Patient<select name="patientId" required><option value="">Choose patient</option>${pats.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Doctor<select name="doctorId"><option value="">Unassigned</option>${ds.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></label><label>Service<select name="serviceId"><option value="">Choose service</option>${sv.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>${field('date','Date',today(),'date')}${field('time','Time','09:00','time')}<label>Status<select name="status"><option>Booked</option><option>Completed</option><option>Cancelled</option></select></label>${field('pulses','Laser pulses used',0,'number','min="0" step="1"')}${field('packageRemaining','Package pulses remaining (optional)','', 'number','min="0" step="1"')}${field('sessionPay','Doctor session pay override (optional)','0','number','min="0" step="0.01"')}${field('pulsePay','Doctor pulse pay override (optional)','0','number','min="0" step="0.0001"')}${area('notes','Session notes','')}</div>`,()=>{let v=formValues();if(!v.patientId)return alert('Choose a patient.'),false;let a={id:uuid(),...v};db.appointments.push(a);save();log('Session scheduled',`${patientName(a.patientId)} · ${a.date} ${a.time}`)})};
window.sendWhatsApp=id=>{let a=db.appointments.find(x=>x.id===id),p=db.patients.find(x=>x.id===a?.patientId);if(!p)return alert('Patient is missing.');let text=(db.settings.whatsappTemplate||'').replaceAll('{name}',p.name||'').replaceAll('{service}',serviceName(a.serviceId)).replaceAll('{date}',a.date).replaceAll('{time}',a.time);let phone=(p.phone||'').replace(/[^\d]/g,'');if(!phone)return alert('Add a phone number with country code first.');window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank','noopener');log('WhatsApp reminder opened',p.name)};
window.openTransaction=()=>{openModal('Record financial entry',`<div class="form-grid"><label>Type<select name="type"><option value="income">Income</option><option value="expense">Expense</option></select></label>${field('date','Date',today(),'date')}<label>Patient (optional)<select name="patientId"><option value="">Not patient-related</option>${db.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Payment method<input name="method" list="methods" placeholder="Cash, card, transfer…"><datalist id="methods"><option>Cash</option><option>Card</option><option>Bank transfer</option><option>Mobile wallet</option></datalist></label>${field('amount','Amount',0,'number','min="0" step="0.01"')}${field('details','Description','')}</div>`,()=>{let v=formValues();if(Number(v.amount)<=0)return alert('Enter an amount greater than zero.'),false;db.transactions.push({id:uuid(),...v});save();log('Financial entry added',`${v.type} · ${v.amount} ${v.method}`)})};
window.openInventory=()=>{openModal('Add inventory item',`<div class="form-grid">${field('name','Item name','')}${field('category','Category','')}${field('qty','Quantity on hand',0,'number','step="1"')}${field('reorder','Reorder threshold',0,'number','step="1"')}${field('cost','Unit cost',0,'number','min="0" step="0.01"')}</div>`,()=>{let v=formValues();if(!v.name.trim())return alert('Item name is required.'),false;db.inventory.push({id:uuid(),...v});save();log('Inventory item added',v.name)})};
window.adjustStock=id=>{let i=db.inventory.find(x=>x.id===id);let q=prompt(`New quantity for ${i.name}:`,i.qty);if(q===null||!Number.isFinite(Number(q)))return;i.qty=Number(q);save();log('Inventory adjusted',`${i.name} → ${i.qty}`);render()};
window.deleteItem=(key,id)=>{if(!confirm('Delete this entry?'))return;let row=db[key].find(x=>x.id===id);db[key]=db[key].filter(x=>x.id!==id);save();log('Entry deleted',row?.name||row?.details||key);render()};
window.exportData=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clinicdesk-backup.json';a.click();URL.revokeObjectURL(a.href);log('Data exported','JSON backup')};
window.importData=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result);if(!parsed||typeof parsed!=='object')throw Error();db={...structuredClone(seed),...parsed};save();log('Data imported',f.name);render();alert('Import complete.')}catch{alert('That file could not be imported.')}};r.readAsText(f)};
window.clearData=()=>{if(!confirm('Permanently clear this browser’s ClinicDesk data? Export a backup first if needed.'))return;db=structuredClone(seed);save();log('Local data cleared','');render()};
window.saveAppwrite=()=>{let cfg={endpoint:$('#endpoint').value.trim(),projectId:$('#projectId').value.trim(),databaseId:$('#databaseId').value.trim(),collectionId:$('#collectionId').value.trim()};localStorage.setItem('clinicdesk-appwrite-config',JSON.stringify(cfg));$('#appwriteStatus').textContent='Settings saved in this browser. Connection not yet verified.'};
window.testAppwrite=()=>{let out=$('#appwriteStatus'),cfg=JSON.parse(localStorage.getItem('clinicdesk-appwrite-config')||'{}');if(!cfg.endpoint||!cfg.projectId){out.textContent='Enter and save the endpoint and project ID first.';return}if(!window.Appwrite?.Client){out.textContent='SDK is not available. Check the network and CDN script load.';return}try{let c=new Appwrite.Client().setEndpoint(cfg.endpoint).setProject(cfg.projectId);out.textContent='Appwrite client initialized. This only checks client configuration; it does not verify authentication, database access, or permissions.'}catch(e){out.textContent='Could not initialize the client. Check the saved endpoint and project ID.'}};
window.saveTemplate=()=>{db.settings.whatsappTemplate=$('#waTemplate').value;save();log('WhatsApp template updated','Reminder template');alert('Reminder template saved.')};
window.setActiveDoctor=()=>{let id=$('#activeDoctor').value;if(id)localStorage.setItem('clinicdesk-doctor-id',id);render();alert('Demo doctor selection saved.')};
function renderSettingsValues(){let cfg=JSON.parse(localStorage.getItem('clinicdesk-appwrite-config')||'{}');if($('#endpoint'))$('#endpoint').value=cfg.endpoint||'';if($('#projectId'))$('#projectId').value=cfg.projectId||'';if($('#databaseId'))$('#databaseId').value=cfg.databaseId||'';if($('#collectionId'))$('#collectionId').value=cfg.collectionId||''}
const oldRender=render;render=function(){oldRender();if(current==='settings')renderSettingsValues()};
/* Optional Appwrite browser SDK; no API key is embedded. */
</script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</body>
</html>
